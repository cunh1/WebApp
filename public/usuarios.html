<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebApp_Seiren - Usuários</title>
    <link rel="stylesheet" href="usuarios_style.css">
    <link rel="stylesheet" href="frontend-modern.css">
    <script src="toast.js" defer></script>
    <script src="usuarios.js" defer></script>
</head>
<body>
    <div id="container">

        <header class="item">
            <img class="logo" id="logo" src="res/logo_150x150.png" alt="Logo Seiren">
            <h1 id="titulo">Gerenciamento de Usuários</h1>
            <a id="voltar" href="home.html">← Chamados</a>
            <span id="usuarioLogado"></span>
            <button id="sair" type="button">Sair</button>
        </header>

        <main class="item">
            <div id="barraSuperior">
                <input type="text" id="busca" class="text" placeholder="Pesquisar por nome ou login..." aria-label="Pesquisar usuários por nome ou login">
                <button type="button" class="button" id="novoUsuario">+ Novo usuário</button>
            </div>

            <div id="mensagem" role="status" aria-live="polite"></div>
            <div id="carregando" role="status">Carregando usuários...</div>

            <table id="tabelaUsuarios" aria-label="Lista de usuários">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Login</th>
                        <th>Cargo</th>
                        <th>Setor</th>
                        <th>Estado</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoUsuarios"></tbody>
            </table>
            <section id="listaVazia" class="empty-state" role="status" aria-live="polite" hidden>
                <span class="empty-state__icon" aria-hidden="true">
                    <svg viewBox="0 0 48 48" focusable="false"><path d="M24 24a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM9 41c1-8 6-12 15-12s14 4 15 12M37 11v10m-5-5h10" /></svg>
                </span>
                <h2 id="listaVaziaTitulo">Nenhum usuário cadastrado</h2>
                <p id="listaVaziaTexto">Cadastre um usuário para que ele apareça nesta lista.</p>
                <div class="empty-state__actions">
                    <button type="button" class="button" id="criarPrimeiroUsuario">Criar usuário</button>
                    <button type="button" class="button empty-state__secondary" id="limparBusca" hidden>Limpar busca</button>
                </div>
            </section>
        </main>

    </div>

    <!-- Modal de criar/editar usuário -->
    <div id="overlayForm">
        <div id="modalForm" role="dialog" aria-modal="true" aria-labelledby="tituloForm">
            <h2 class="Titulo" id="tituloForm">Novo usuário</h2>
            <form id="formUsuario">
                <label class="rotulo" for="campoNome">Nome</label>
                <input type="text" id="campoNome" class="text" required>

                <label class="rotulo" for="campoLogin">Login</label>
                <input type="text" id="campoLogin" class="text" required autocomplete="off">

                <label class="rotulo" for="campoSenha">
                    <span id="rotuloSenha">Senha</span>
                </label>
                <input type="password" id="campoSenha" class="text" autocomplete="new-password" aria-describedby="dicaSenha">
                <small id="dicaSenha">Mínimo de 8 caracteres.</small>

                <label class="rotulo" for="campoPapel">Nível de acesso</label>
                <select id="campoPapel" class="text">
                    <option value="usuario">Usuário comum</option>
                    <option value="ti">TI</option>
                    <option value="manutencao">Manutenção</option>
                    <option value="admin">Administrador</option>
                </select>
                <label class="rotulo" for="campoSetor">Setor (para usuário comum/administrador)</label>
                <select id="campoSetor" class="text">
                    <option value="">Não definido</option>
                    <option value="TI">TI</option>
                    <option value="Manutenção">Manutenção</option>
                </select>
                <div id="erroForm" role="alert"></div>

                <div class="modal-botoes">
                    <button type="submit" class="button" id="salvarUsuario">Salvar</button>
                    <button type="button" class="button" id="cancelarForm">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de confirmação (excluir / promover / rebaixar) -->
    <div id="overlay">
        <div id="modal-confirma" role="dialog" aria-modal="true" aria-labelledby="overlayTexto">
            <p id="overlayTexto">Confirma a ação?</p>
            <div class="modal-botoes">
                <button type="button" id="btnConfirmar">Confirmar</button>
                <button type="button" id="btnCancelar">Cancelar</button>
            </div>
        </div>
    </div>

</body>
</html>
