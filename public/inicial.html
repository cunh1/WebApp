<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebApp_Seiren</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="frontend-modern.css">
    <script src="toast.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="tela_inicial">
    <div class="card">
        <img src="res/seiren-logo.png" id="logo" alt="SEIREN">
        <label for="nome">Login</label>
        <input type="text" id="nome" aria-label="Login" autocomplete="username">
        <label for="senha">Senha</label>
        <input type="password" id="senha" aria-label="Senha" autocomplete="current-password">
        <label class="manter-conectado" for="manterConectado">
            <input type="checkbox" id="manterConectado">
            <span>Manter conectado</span>
        </label>
        <button type="button" id="botao">
            <span>Entrar</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </button>
        <img id="digital" src="res/imagem1.png" alt="" aria-hidden="true">
    </div>
    </div>
</body>
</html>
