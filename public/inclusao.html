<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{const t=localStorage.getItem('webapp.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch{}</script>
    <title>WebApp_Seiren - Chamado</title>
    <link rel="stylesheet" href="inclusao_style.css">
    <link rel="stylesheet" href="frontenwdd-modern.css">
    <script src="toast.js" defer></script>
    <script src="theme.js" defer></script>
    <script src="inclusao.js?v=20261119-audit1" defer></script>
</head>
<body>
    <div class="tela">
        <h1 class="Titulo" id="labelTitulo">XXXXXXX</h1>
        <div class="linha_1">
            <textarea class="text" id="Nchamado" placeholder="Chamado" aria-label="Chamado"></textarea>
            <select class="text" id="Tipo" aria-label="Tipo">
                <option value="">Selecione...</option>
                <option value="Manutenção">Manutenção</option>
                <option value="T.I">T.I</option>
            </select>
            <select class="text" id="Evento" aria-label="Evento">
                <option value="">Selecione...</option>
                <option value="1">Item 1</option>
                <option value="2">Item 2</option>
                <option value="3">Item 3</option>
            </select>
        </div>
        
        <div class="linha_2">
            <textarea class="text" id="Solicitacao" placeholder="Solicitação" aria-label="Solicitação"></textarea>
        </div>

        <div class="linha_3">
            <div class="cartao-anexo">
                <input type="file" id="inputImagem1" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
                <button type="button" class="botao-anexo" data-input-imagem="inputImagem1">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4"/></svg>
                    <span>Anexar imagem 1</span>
                </button>
                <img class="image" id="imagem1" alt="Pré-visualização da imagem 1" hidden>
            </div>

            <div class="cartao-anexo">
                <input type="file" id="inputImagem2" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
                <button type="button" class="botao-anexo" data-input-imagem="inputImagem2">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4"/></svg>
                    <span>Anexar imagem 2</span>
                </button>
                <img class="image" id="imagem2" alt="Pré-visualização da imagem 2" hidden>
            </div>
        </div>

        <div class="linha_4">
            <button type="button" class="button" id="salvar">Salvar</button>
            <button type="button" class="button" id="cancelar">Cancelar</button>
        </div>

    </div>
</body>
</html>
